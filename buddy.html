<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stream Buddy</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* The page IS the character: it fills the browser source, so size and place it in Streamlabs. */
  #wrap { position: fixed; inset: 0; display: grid; place-items: start center; padding-top: 2vh; box-sizing: border-box; }
  /* captions: what he is saying, a few words at a time. The helmet gets a bar under his mouth; Chip gets a thought bubble above his head. */
  #cap { position: fixed; left: 3vw; right: 3vw; bottom: 2.5vh; text-align: center; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
  #cap.on { opacity: 1; }
  #cap svg, #cap i { display: none; }
  #capText { display: inline-block; padding: .18em .5em .22em; border-radius: .35em; background: rgba(0,0,0,.78); color: #fff;
             font: 400 min(8.2vw, 10.5vh)/1.08 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .03em; text-transform: uppercase;
             -webkit-text-stroke: .07em #000; paint-order: stroke fill; text-shadow: 0 .06em .12em #000; border: .06em solid #39ff6a; }
  #capText:empty { display: none; }
  #capText.pop { animation: cap .16s cubic-bezier(.2,1.6,.3,1) 1; }
  @keyframes cap { 0% { transform: scale(.82); } 100% { transform: scale(1); } }
  #head { position: relative; height: 74vh; aspect-ratio: 776 / 900; max-width: 92vw; transform-origin: 50% 92%; will-change: transform; }
  /* ---- thought-bubble layout (Chip): bubble on top, head below ---- */
  body.bubble #wrap { padding-top: 37vh; }
  body.bubble #head { height: 56vh; max-width: 88vw; }
  body.bubble #cap { left: 50%; right: auto; bottom: auto; top: 1.5vh; width: min(92vw, 120vh); height: 27vh; margin-left: calc(min(92vw, 120vh) / -2);
                     transform: scale(.7); transform-origin: 40% 100%; transition: opacity .14s ease, transform .18s cubic-bezier(.2,1.6,.3,1); will-change: transform, opacity; }
  body.bubble #cap.on { transform: scale(1); }
  body.bubble #cap svg { display: block; position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  body.bubble #capText { position: absolute; left: 9%; right: 9%; top: 12%; bottom: 20%; display: grid; place-items: center; padding: 0; border: 0; border-radius: 0; background: none; color: #111;
                         font: 700 min(7.2vw, 9.4vh)/1.02 "Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", "Arial Black", sans-serif; letter-spacing: .01em;
                         -webkit-text-stroke: 0; text-shadow: none; }
  body.bubble #cap i { display: block; position: absolute; border-radius: 50%; background: #fff; border: .7vh solid #111; box-sizing: border-box; }
  body.bubble #cap i.t1 { left: 36%; top: 101%; width: 5.6vh; height: 5.6vh; }
  body.bubble #cap i.t2 { left: 41%; top: 123%; width: 3.6vh; height: 3.6vh; }
  body.nocap #cap { display: none; }
  body.nocap #head { height: 86vh; }
  body.nocap #wrap { place-items: center; padding-top: 0; }
  #head img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
  #head img#m0 { opacity: 1; }
  /* the lights: soft glows laid over the green parts of the helmet, brightened and dimmed from the script */
  .lamp { position: absolute; border-radius: 50%; opacity: 0; pointer-events: none; mix-blend-mode: screen; transform: translate(-50%, -50%); will-change: opacity;
          background: radial-gradient(closest-side, rgba(190,255,200,.95), rgba(57,255,106,.6) 38%, rgba(57,255,106,0)); }
  #dbg { position: fixed; left: 8px; bottom: 8px; font: 12px ui-monospace, Menlo, monospace; color: #7dffa6; background: rgba(0,0,0,.7); padding: 6px 8px; border-radius: 6px; display: none; white-space: pre; }
</style>
</head>
<body>
<div id="wrap"><div id="head">
  <img id="m0" alt=""><img id="m1" alt=""><img id="m2" alt=""><img id="blink" alt="">
</div></div>
<div id="cap"><svg viewBox="0 0 400 150" preserveAspectRatio="none"><g fill="#111" stroke="#111" stroke-width="9" vector-effect="non-scaling-stroke"><ellipse cx="70" cy="78" rx="62" ry="50"/><ellipse cx="130" cy="52" rx="70" ry="44"/><ellipse cx="205" cy="44" rx="78" ry="40"/><ellipse cx="280" cy="52" rx="70" ry="44"/><ellipse cx="336" cy="80" rx="58" ry="48"/><ellipse cx="300" cy="108" rx="72" ry="36"/><ellipse cx="215" cy="116" rx="84" ry="30"/><ellipse cx="125" cy="112" rx="78" ry="34"/><ellipse cx="200" cy="80" rx="150" ry="50"/></g><g fill="#fff"><ellipse cx="70" cy="78" rx="62" ry="50"/><ellipse cx="130" cy="52" rx="70" ry="44"/><ellipse cx="205" cy="44" rx="78" ry="40"/><ellipse cx="280" cy="52" rx="70" ry="44"/><ellipse cx="336" cy="80" rx="58" ry="48"/><ellipse cx="300" cy="108" rx="72" ry="36"/><ellipse cx="215" cy="116" rx="84" ry="30"/><ellipse cx="125" cy="112" rx="78" ry="34"/><ellipse cx="200" cy="80" rx="150" ry="50"/></g></svg><i class="t1"></i><i class="t2"></i><div id="capText"></div></div>
<div id="dbg"></div>
<script>
/* Stream buddy face. Four drawings of the same helmet (mouth shut / half open / wide open / eyes closed) are swapped
   in time with the loudness of whatever it is saying, so the mouth follows the actual voice. It blinks, its lights
   pulse, and when the control page says music is playing it bops its head.
   ?captions=0 hides the captions   ?demo=1 speaks a test line on a loop   ?demo=music also bops   ?debug=1 shows a readout
   ?radio=0..1 how much helmet-radio effect (default 0.6)   ?vol=0..1.5 */
const qs = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const head = $("head"), m = [$("m0"), $("m1"), $("m2"), $("blink")], dbg = $("dbg");
if (qs.has("debug")) dbg.style.display = "block";
if (qs.get("captions") === "0") document.body.classList.add("nocap");          // ?captions=0 hides them

/* Which character is on screen. The helmet (Trooper) is the default; add ?look=chip for Chip, the game-show host.
   Each look is four drawings of the same head: mouth shut / half open / wide open / eyes closed. */
const LOOKS = {
  chip:    { dir: "buddy/chip/", ratio: "917 / 900", lamps: false, squash: 0.35, origin: "50% 70%" },
  trooper: { dir: "buddy/",      ratio: "776 / 900", lamps: true,  squash: 1,    origin: "50% 92%" },
};
const LOOK = LOOKS[qs.get("look")] || LOOKS.trooper;
if (!LOOK.lamps) document.body.classList.add("bubble");      // Chip's captions go in a thought bubble above him
["m0", "m1", "m2", "blink"].forEach((n, i) => { m[i].src = LOOK.dir + n + ".webp"; });
head.style.aspectRatio = LOOK.ratio; head.style.transformOrigin = LOOK.origin;
if (!LOOK.lamps) { const fade = "linear-gradient(to bottom, #000 78%, rgba(0,0,0,0) 98%)"; head.style.webkitMaskImage = fade; head.style.maskImage = fade; }   // Chip's shoulders fade out instead of ending in a hard edge
/* where the lights are on the helmet drawing, in % of its width / height: [name, x, y, size] */
const LAMPS = LOOK.lamps ? [["antenna", 49.8, 6.6, 46], ["eyeL", 36.3, 60.1, 50], ["eyeR", 66.1, 63.1, 38], ["cheekL", 20.1, 77.8, 26], ["cheekR", 79.2, 77.9, 26], ["mouth", 50, 80.5, 44]] : [];
const lamp = {}; for (const [k, x, y, z] of LAMPS) { const d = document.createElement("div"); d.className = "lamp"; d.style.left = x + "%"; d.style.top = y + "%"; d.style.width = z + "%"; d.style.aspectRatio = "1"; head.appendChild(d); lamp[k] = d; }

let AC = null;
const ac = () => AC || (AC = new (window.AudioContext || window.webkitAudioContext)());
const talk = { env: null, step: 0.02, dur: 0, src: null, t0: 0, clock: null, level: 0, open: 0, blocked: false, id: 0 };
const RADIO = qs.get("radio") === null ? (LOOK.lamps ? 0.6 : 0) : Math.max(0, Math.min(1, parseFloat(qs.get("radio")) || 0));   // Chip speaks clean; only the helmet gets the radio effect by default   // 0 = clean voice, 1 = heavy helmet radio
const VOL = Math.max(0, Math.min(1.5, parseFloat(qs.get("vol") || "1") || 1));

/* The voice is played through a "helmet radio" chain: thin the lows and highs, add a little grit. */
function chain(ctx, lineVol = 1) {
  if (RADIO === 0) { const clean = ctx.createGain(); clean.gain.value = VOL * lineVol; clean.connect(ctx.destination); return clean; }   // no effect at all: the voice exactly as recorded
  const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 120 + 330 * RADIO;
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 9000 - 5600 * RADIO;
  const sh = ctx.createWaveShaper(); const n = 1024, c = new Float32Array(n), k = 1 + RADIO * 14;
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(x * k) / Math.tanh(k); } sh.curve = c;
  const g = ctx.createGain(); g.gain.value = VOL * lineVol * (1 - RADIO * 0.25);
  hp.connect(lp); lp.connect(sh); sh.connect(g); g.connect(ctx.destination);
  return hp;
}
/* Work out how loud the clip is every 20ms; the mouth is driven from this, in step with playback. */
function envelope(buf) {
  const d = buf.getChannelData(0), n = Math.floor(buf.sampleRate * talk.step), out = [];
  for (let i = 0; i < d.length; i += n) { let s = 0; const e = Math.min(d.length, i + n); for (let j = i; j < e; j++) s += d[j] * d[j]; out.push(Math.sqrt(s / (e - i))); }
  const peak = Math.max(0.0001, ...out);
  return out.map(v => v / peak);
}
/* captions: split the line into short groups and show each for its share of the clip */
const cap = { groups: [], at: [], i: -1 };
function setCaptions(text, dur) {
  cap.groups = []; cap.at = []; cap.i = -1;
  const words = String(text || "").trim().split(/\s+/).filter(Boolean); if (!words.length) return;
  let cur = [];
  for (const w of words) { cur.push(w); const str = cur.join(" "); if (cur.length >= 4 || str.length >= 22 || /[.!?,;:]$/.test(w)) { cap.groups.push(str); cur = []; } }
  if (cur.length) cap.groups.push(cur.join(" "));
  const total = cap.groups.reduce((n, g) => n + g.length + 2, 0); let t = 0;
  for (const g of cap.groups) { cap.at.push(t); t += (g.length + 2) / total * dur * 0.96; }
}
function showCaption(t) {
  if (!cap.groups.length) return;
  let i = 0; while (i + 1 < cap.at.length && t >= cap.at[i + 1]) i++;
  if (i !== cap.i) { cap.i = i; const el = $("capText"); el.textContent = cap.groups[i]; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); $("cap").classList.add("on"); }
}
async function say(url, text) {
  const id = ++talk.id;
  const hv = /#v=([\d.]+)/.exec(url), lineVol = hv ? Math.max(0, Math.min(1.5, parseFloat(hv[1]) || 0)) : 0.45;   // volume set on the control page
  const ctx = ac();
  const buf = await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer());
  if (id !== talk.id) return;                       // a newer line (or a stop) arrived while this one was loading
  stop(true);
  try { ctx.resume(); } catch (e) {}                // never wait on this: an ordinary browser holds it until the page is clicked
  talk.env = envelope(buf); talk.dur = buf.duration; talk.blocked = ctx.state !== "running";
  setCaptions(text, buf.duration);
  if (talk.blocked) talk.clock = performance.now();        // ordinary browsers refuse sound until clicked: animate anyway
  else { const src = ctx.createBufferSource(); src.buffer = buf; src.connect(chain(ctx, lineVol)); src.start(); talk.src = src; talk.t0 = ctx.currentTime; }
  return new Promise(res => setTimeout(() => { if (id === talk.id) stop(true); res(); }, buf.duration * 1000 + 80));
}
function stop(keepId) { if (!keepId) talk.id++; if (talk.src) { try { talk.src.stop(); } catch (e) {} } talk.src = null; talk.env = null; cap.groups = []; cap.i = -1; $("cap").classList.remove("on"); }

/* music: the control page hears the room and tells this page when a song is playing; he bops until told otherwise.
   The signal is repeated every 20 seconds while music plays, so if it ever stops arriving he settles by himself. */
const music = { until: qs.get("demo") === "music" ? Infinity : 0, amt: 0 };
const eyes = { next: performance.now() + 2500, until: 0 };
let showing = 0;
function frame(now) {
  // 1. how loud is the voice right now?
  let target = 0;
  if (talk.env) {
    const t = talk.blocked ? (now - talk.clock) / 1000 : AC.currentTime - talk.t0;
    target = talk.env[Math.min(talk.env.length - 1, Math.max(0, Math.floor(t / talk.step)))] || 0;
    showCaption(t);
  }
  // 2. mouths open fast and close a little slower, like a real jaw
  talk.level += (target - talk.level) * (target > talk.level ? 0.55 : 0.22);
  const L = talk.level, speaking = !!talk.env, s = now / 1000;
  const open = L > 0.42 ? 2 : L > 0.13 ? 1 : 0;
  // 3. blinking: every few seconds, and only while the mouth is shut (the blink drawing has a closed mouth)
  if (now > eyes.next) { eyes.until = now + 130; eyes.next = now + 2200 + Math.random() * 3800 + (Math.random() < 0.2 ? -1900 : 0); }
  const blinking = open === 0 && now < eyes.until, pic = blinking ? 3 : open;
  if (pic !== showing) { m.forEach((img, i) => img.style.opacity = i === pic ? 1 : 0); showing = pic; talk.open = open; }
  // 4. is music playing? ease in and out of the bop so it never snaps
  const on = Date.now() < music.until; music.amt += ((on ? 1 : 0) - music.amt) * 0.05; const B = music.amt;
  const beat = Math.abs(Math.sin(s * Math.PI * 1.95)), hit = Math.pow(1 - beat, 3);     // "hit" spikes once per nod, at the bottom of it
  // 5. lights (helmet only): a slow idle pulse, brighter with his voice, and flashing with the nod when music is on
  if (LOOK.lamps) {
    const idle = 0.5 + 0.5 * Math.sin(s * 2.1), v = Math.min(1, L * 1.4);
    lamp.antenna.style.opacity = Math.min(1, 0.25 + 0.3 * idle + v * 0.7 + B * hit * 0.9).toFixed(3);
    const eye = blinking ? 0 : Math.min(1, 0.12 + 0.12 * idle + v * 0.55 + B * hit * 0.4).toFixed(3); lamp.eyeL.style.opacity = eye; lamp.eyeR.style.opacity = eye;
    const side = Math.sin(s * Math.PI * 1.95) > 0;                                        // cheeks take turns on the beat
    lamp.cheekL.style.opacity = Math.min(1, 0.15 + v * 0.5 + B * (side ? 0.9 : 0.05) * (0.4 + 0.6 * hit)).toFixed(3);
    lamp.cheekR.style.opacity = Math.min(1, 0.15 + v * 0.5 + B * (side ? 0.05 : 0.9) * (0.4 + 0.6 * hit)).toFixed(3);
    lamp.mouth.style.opacity = (open ? Math.min(1, 0.25 + v * 0.75) : 0).toFixed(3);
  }
  // 6. body language: a lazy float and sway; squash and stretch while talking; a head-nod bop while music plays
  const floatY = Math.sin(s * 1.5) * 2.2 + Math.sin(s * 0.63) * 1.1, sway = Math.sin(s * 0.8) * 3 + Math.sin(s * 2.3) * 0.8;
  const talkY = speaking ? Math.sin(s * 9) * L * 2 : 0, talkR = speaking ? Math.sin(s * 5.3) * L * 4 : 0;
  const bopY = B * (1 - beat) * 7.5, bopR = B * Math.sin(s * Math.PI * 0.975) * 4.5;       // drops on each nod, leans side to side every other one
  const q = LOOK.squash, sx = 1 + (L * 0.03 + B * hit * 0.05) * q, sy = 1 + (L * 0.07 - B * hit * 0.07) * q;            // wider and shorter at the bottom of a nod
  head.style.transform = `translateY(${(floatY * (1 - B * 0.6) + talkY + bopY).toFixed(2)}%) rotate(${(sway * (1 - B * 0.5) + talkR + bopR).toFixed(2)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
  if (qs.has("debug")) dbg.textContent = `speaking: ${speaking}  level: ${L.toFixed(2)}  mouth: ${open}  music: ${on} (${B.toFixed(2)})  sound blocked: ${talk.blocked}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.buddy = { say, stop, talk, music };

/* ---- live lines: the brain's replies arrive here (same channel as the rating card and sound pads) ---- */
const STATE_URL = "https://zlujvgqnvrhxrhkefgqr.supabase.co/functions/v1/nero-rating";
let budN = null;
const setMusic = e => { music.until = e.music ? (e.at || Date.now()) + 32000 : 0; };
async function poll() {
  let pause = 30;
  try {
    const j = await (await fetch(STATE_URL + "?bud=" + (budN ?? -1) + "&wait=" + (budN === null ? 0 : 20) + "&t=" + Date.now(), { cache: "no-store" })).json();
    if (!j.ok) throw new Error(j.error || "bad reply");
    if (budN === null) { budN = j.buddy_n;                  // first look: do not replay old lines, but do pick up whether music is on
      const lastMusic = (j.buddy || []).filter(e => "music" in e).pop(); if (lastMusic) setMusic(lastMusic); }
    else if (j.buddy_n !== budN) {
      const fresh = (j.buddy || []).filter(e => e.n > budN); budN = j.buddy_n;
      fresh.filter(e => "music" in e).forEach(setMusic);
      const last = fresh.filter(e => !("music" in e)).pop();
      if (last) { if (last.stop) stop(); else say(last.url, last.text).catch(() => {}); }
    }
  } catch (e) { pause = 2000; }
  setTimeout(poll, pause);
}
if (qs.has("demo")) { document.body.style.background = "#1a1d24"; addEventListener("pointerdown", () => { try { ac().resume(); } catch (e) {} }, { once: true });
  (async function loop() { try { await (LOOK.lamps ? say("buddy/demo.mp3", "Yo chat, I'm online. Illmind, that last beat? The drums were crazy. But that mix... needs some help, my guy.")
    : say("buddy/chip/demo.wav#v=0.9", "Hello everybody, and welcome to The Feedback Loop! I'm your host, Chip Sterling. Now THAT is a hit!")); } catch (e) { dbg.textContent = "demo failed: " + e; } setTimeout(loop, 3500); })(); }
else poll();
</script>
</body>
</html>
