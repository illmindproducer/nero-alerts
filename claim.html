<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0612">
<title>Claim your prize</title>
<style>
  :root { --gold: #ffd34d; --green: #39ff6a; --ink: #f4eefc; --dim: #a99bc0; --line: #3a2a55; --red: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0612; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; }
  body { min-height: 100dvh; padding: 28px 16px 60px; background: radial-gradient(ellipse at 50% 0, #2a1245, #0a0612 60%); }
  main { max-width: 520px; margin: 0 auto; }
  .k { font: 400 15px/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .22em; color: var(--gold); }
  h1 { margin: 10px 0 6px; font: 400 38px/1.05 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .02em; color: var(--gold); overflow-wrap: anywhere; }
  .sub { color: var(--dim); margin: 0 0 22px; }
  .sub b { color: var(--ink); font-weight: 600; }
  form { background: rgba(20, 10, 34, .85); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  label { display: block; margin-top: 14px; font-size: 14px; color: var(--dim); }
  label:first-child { margin-top: 0; }
  label i { font-style: normal; opacity: .7; }
  input, textarea, select { width: 100%; margin-top: 6px; padding: 12px; font: inherit; color: var(--ink); background: #0d0718; border: 1px solid var(--line); border-radius: 10px; outline: 0; }
  input:focus, textarea:focus, select:focus { border-color: var(--gold); }
  textarea { min-height: 84px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { width: 100%; margin-top: 20px; padding: 15px; border: 0; border-radius: 12px; background: linear-gradient(180deg, #ffe27a, #e2a400); color: #2a1a00; font: 400 20px/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .1em; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); display: none; }
  .msg.err { display: block; border-color: var(--red); color: var(--red); }
  .msg.ok { display: block; border-color: var(--green); color: var(--green); }
  .fine { margin-top: 16px; font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <div class="k">ILLMIND · THE FEEDBACK LOOP</div>
  <h1 id="title">Loading…</h1>
  <p class="sub" id="sub"></p>
  <form id="form" style="display:none" novalidate></form>
  <div class="msg" id="msg"></div>
  <p class="fine" id="fine" style="display:none">Your details are used only to get this prize to you and are never shown on stream.</p>
</main>
<script>
/* The page a winner opens from their email to claim a prize. The link carries a one-off token (?t=…).
   What it asks for depends on the kind of prize. */
const $ = id => document.getElementById(id);
const WHEEL_URL = "https://zlujvgqnvrhxrhkefgqr.supabase.co/functions/v1/nero-wheel";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
/* [key, label, type, required, half-width] */
const F = {
  name: ["name", "Your name", "text", true], email: ["email", "Email address", "email", true],
  physical: [["address1", "Street address", "text", true], ["address2", "Apartment, suite, etc. <i>(optional)</i>", "text", false], ["city", "City", "text", true, 1], ["state", "State / province", "text", true, 1],
    ["zip", "ZIP / postal code", "text", true, 1], ["country", "Country", "text", true, 1], ["phone", "Phone for the courier <i>(optional)</i>", "tel", false], ["size", "Size, if it is clothing <i>(optional)</i>", "text", false]],
  digital: [],
  call: [["timezone", "Your time zone", "text", true], ["availability", "Days and times that work for you", "area", true]],
  membership: [["account_email", "Email for your club account <i>(if different from above)</i>", "email", false]],
  social: [["instagram", "Your Instagram handle", "text", true]],
  submission: [["nero_email", "Email on your Nero account <i>(if different from above)</i>", "email", false]],
};
const INTRO = { physical: "Tell us where to ship it.", digital: "Tell us where to send it.", call: "Tell us when you are free and we will set it up.", membership: "Tell us which email to set your membership up under.",
  social: "Tell us your handle so the follow and shout out go to the right account.", submission: "Tell us which Nero account gets the free submission." };
const say = (t, cls) => { $("msg").textContent = t; $("msg").className = "msg " + (cls || ""); };
function field([key, label, type, req, half]) {
  const tag = type === "area" ? `<textarea name="${key}" ${req ? "required" : ""} maxlength="400"></textarea>` : `<input name="${key}" type="${type}" ${req ? "required" : ""} maxlength="200" autocomplete="${{ name: "name", email: "email", address1: "address-line1", address2: "address-line2", city: "address-level2", state: "address-level1", zip: "postal-code", country: "country-name", phone: "tel" }[key] || "off"}">`;
  return { html: `<label>${label}${tag}</label>`, half: !!half };
}
(async function start() {
  if (!TOKEN) { $("title").textContent = "This link is incomplete"; $("sub").textContent = "Open the link from your email again."; return; }
  let j; try { j = await (await fetch(WHEEL_URL + "?claim=" + encodeURIComponent(TOKEN), { cache: "no-store" })).json(); } catch (e) { $("title").textContent = "Could not load"; $("sub").textContent = "Check your connection and reload the page."; return; }
  if (!j.ok) { $("title").textContent = "This link is not valid"; $("sub").textContent = "Open the link from your email again, or reply to that email for help."; return; }
  $("title").textContent = "You won: " + j.prize;
  if (j.closed) { $("sub").textContent = "This prize has already been sent. Reply to the email you got if something is wrong."; return; }
  const sub = $("sub"); sub.textContent = "";
  sub.append("Congrats", j.winner ? ", " : "", Object.assign(document.createElement("b"), { textContent: j.winner || "" }), "! ", INTRO[j.kind] || "Fill this in to claim it.", j.claimed ? " You already sent your details; sending again replaces them." : "");
  const fields = [F.name, F.email, ...(F[j.kind] || [])].map(field); let html = "";
  for (let i = 0; i < fields.length; i++) { if (fields[i].half && fields[i + 1] && fields[i + 1].half) { html += `<div class="two">${fields[i].html}${fields[i + 1].html}</div>`; i++; } else html += fields[i].html; }
  $("form").innerHTML = html + `<button type="submit">CLAIM MY PRIZE</button>`; $("form").style.display = "block"; $("fine").style.display = "block";
  $("form").elements.name.value = j.winner || "";
  $("form").onsubmit = async e => {
    e.preventDefault(); const form = e.target, data = {};
    for (const el of form.elements) { if (!el.name) continue; const v = el.value.trim(); if (el.required && !v) { el.focus(); return say("Please fill in: " + el.closest("label").childNodes[0].textContent.trim(), "err"); } if (v) data[el.name] = v; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email || "")) { form.elements.email.focus(); return say("That email address doesn't look right.", "err"); }
    const btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "SENDING…"; say("");
    try { const r = await (await fetch(WHEEL_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ claim: { token: TOKEN, data } }) })).json();
      if (!r.ok) throw new Error(r.error || "It didn't go through.");
      form.style.display = "none"; $("fine").style.display = "none"; $("sub").textContent = ""; say("Got it. Your details are in, and illmind will be in touch about your prize.", "ok");
    } catch (x) { btn.disabled = false; btn.textContent = "CLAIM MY PRIZE"; say(x.message + " Please try again.", "err"); }
  };
})();
</script>
</body>
</html>
