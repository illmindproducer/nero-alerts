<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rating Overlay</title>
<style>
  :root { --u: 1px; --green: #39ff6a; --gold: #ffd700; --orange: #f97316; --red: #ff4d4d; --ink: #eafff0; --dim: #6f8a78; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink); }
  #card {
    position: fixed; width: calc(600 * var(--u)); padding: calc(26 * var(--u)) calc(28 * var(--u)) calc(24 * var(--u));
    background: linear-gradient(160deg, rgba(10,18,13,.94), rgba(4,8,6,.94));
    border: calc(2 * var(--u)) solid var(--green); border-radius: calc(18 * var(--u));
    box-shadow: 0 0 calc(34 * var(--u)) rgba(57,255,106,.35), inset 0 0 calc(40 * var(--u)) rgba(57,255,106,.07);
    opacity: 0; transform: translateX(calc(-80 * var(--u))) scale(.94); transition: opacity .45s ease, transform .55s cubic-bezier(.2,1.3,.3,1);
    box-sizing: border-box;
  }
  #card.on { opacity: 1; transform: none; }
  body[data-pos="bl"] #card { left: calc(48 * var(--u)); bottom: calc(48 * var(--u)); }
  body[data-pos="br"] #card { right: calc(48 * var(--u)); bottom: calc(48 * var(--u)); }
  body[data-pos="tl"] #card { left: calc(48 * var(--u)); top: calc(48 * var(--u)); }
  body[data-pos="tr"] #card { right: calc(48 * var(--u)); top: calc(48 * var(--u)); }
  body[data-pos="c"]  #card { left: 50%; top: 50%; margin: calc(-300 * var(--u)) 0 0 calc(-300 * var(--u)); }
  body[data-pos="full"] #card { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); }
  body[data-pos="full"] #card.on { transform: translate(-50%, -50%); }
  body[data-pos="full"] #stamp { right: calc(14 * var(--u)); top: calc(10 * var(--u)); transform: rotate(4deg) scale(2.2); }
  body[data-pos="full"] #stamp.on { transform: rotate(4deg) scale(1); }
  body[data-pos$="r"] #card:not(.on) { transform: translateX(calc(80 * var(--u))) scale(.94); }

  .head { display: flex; align-items: center; gap: calc(12 * var(--u)); }
  .dot { width: calc(12 * var(--u)); height: calc(12 * var(--u)); border-radius: 50%; background: var(--green); animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; transform: scale(.7); } }
  .brand { font: 400 calc(30 * var(--u))/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .06em; color: var(--green); }
  .brand b { color: var(--ink); font-weight: 400; }
  .song { margin-top: calc(14 * var(--u)); font: 400 calc(34 * var(--u))/1.1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .02em;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { margin-top: calc(4 * var(--u)); font-size: calc(19 * var(--u)); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .08em; }
  .rule { height: calc(2 * var(--u)); margin: calc(18 * var(--u)) 0 calc(14 * var(--u)); background: linear-gradient(90deg, var(--green), transparent); opacity: .6; }

  .row { display: grid; grid-template-columns: calc(176 * var(--u)) 1fr calc(70 * var(--u)); align-items: center; gap: calc(14 * var(--u)); height: calc(46 * var(--u));
         opacity: 0; transform: translateX(calc(-24 * var(--u))); transition: opacity .35s ease, transform .4s cubic-bezier(.2,1.2,.3,1); }
  #card.on .row { opacity: 1; transform: none; }
  #card.on .row:nth-child(1) { transition-delay: .10s } #card.on .row:nth-child(2) { transition-delay: .17s }
  #card.on .row:nth-child(3) { transition-delay: .24s } #card.on .row:nth-child(4) { transition-delay: .31s }
  #card.on .row:nth-child(5) { transition-delay: .38s }
  .lab { font-size: calc(20 * var(--u)); letter-spacing: .12em; color: var(--ink); }
  .bar { position: relative; height: calc(24 * var(--u)); border-radius: calc(5 * var(--u)); background: rgba(255,255,255,.07); overflow: hidden; }
  .fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: var(--c, var(--green));
          transition: transform .9s cubic-bezier(.2,1.25,.3,1), background-color .4s ease; }
  /* ten blocks: the gaps are drawn on top so the fill reads as LED segments */
  .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 3px), rgba(4,8,6,.95) calc(10% - 3px) 10%); }
  .sheen { position: absolute; top: 0; bottom: 0; width: 30%; left: -30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); opacity: 0; }
  .row.hit .sheen { animation: sweep .9s ease-out 1; }
  @keyframes sweep { 0% { transform: translateX(0); opacity: .9 } 100% { transform: translateX(460%); opacity: 0 } }
  .row.idle .bar { animation: wait 1.6s ease-in-out infinite; }
  @keyframes wait { 50% { opacity: .45 } }
  .num { text-align: right; font: 400 calc(32 * var(--u))/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; color: var(--c, var(--dim)); transition: color .4s ease; }
  .row.hit .num { animation: pop .45s cubic-bezier(.2,1.6,.3,1) 1; }
  @keyframes pop { 0% { transform: scale(1.55) } 100% { transform: scale(1) } }
  .row.na .lab, .row.na .num { color: var(--dim); } .row.na .num { font-size: calc(20 * var(--u)); font-family: inherit; }

  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: calc(16 * var(--u)); padding-top: calc(16 * var(--u)); border-top: calc(2 * var(--u)) dashed rgba(57,255,106,.3); }
  .ovl-lab { font-size: calc(18 * var(--u)); letter-spacing: .16em; color: var(--dim); }
  .tier { margin-top: calc(6 * var(--u)); font: 400 calc(34 * var(--u))/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .05em; color: var(--c, var(--dim)); transition: color .4s ease; }
  .overall { font: 400 calc(96 * var(--u))/.9 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; color: var(--c, var(--dim)); transition: color .4s ease; }
  .overall.hit { animation: pop .5s cubic-bezier(.2,1.6,.3,1) 1; }
  #stamp { position: absolute; right: calc(-18 * var(--u)); top: calc(-22 * var(--u)); padding: calc(8 * var(--u)) calc(16 * var(--u)); border: calc(4 * var(--u)) solid var(--gold); border-radius: calc(8 * var(--u));
           font: 400 calc(30 * var(--u))/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .08em; color: var(--gold); background: rgba(12,10,0,.92);
           transform: rotate(8deg) scale(2.4); opacity: 0; transition: transform .35s cubic-bezier(.3,1.5,.4,1), opacity .2s ease; }
  #stamp.on { transform: rotate(8deg) scale(1); opacity: 1; }
</style>
</head>
<body data-pos="full">
<div id="card">
  <div id="stamp">PLACEMENT READY</div>
  <div class="head"><span class="dot"></span><span class="brand">ILLMIND <b>RATING</b></span></div>
  <div class="song" id="song"></div>
  <div class="artist" id="artist"></div>
  <div class="rule"></div>
  <div id="rows"></div>
  <div class="foot">
    <div><div class="ovl-lab">OVERALL</div><div class="tier" id="tier">—</div></div>
    <div class="overall" id="overall">—</div>
  </div>
</div>
<script>
/* Rating overlay — shows whatever the control page (rate.html) sets. Read-only; no key needed.
   By default the card fills the whole page, so the browser source IS the card: size and place it in Streamlabs.
   URL options: ?pos=bl|br|tl|tr|c   old corner mode on a 1920x1080 canvas
                ?scale=0.9           shrink or grow the card inside the page
                ?demo=1              show sample ratings (for placing it in Streamlabs) */
const STATE_URL = "https://zlujvgqnvrhxrhkefgqr.supabase.co/functions/v1/nero-rating";
const CATS = [["drums", "DRUMS"], ["melody", "MELODY"], ["vocals", "VOCALS"], ["mix", "MIX"], ["originality", "ORIGINALITY"]];
const qs = new URLSearchParams(location.search);
document.body.dataset.pos = qs.get("pos") || "full";
const SCALE = parseFloat(qs.get("scale") || "1") || 1;
let CARD_H = 0;                       // the card's natural height in design units, measured once
function fit() {
  const w = innerWidth, h = innerHeight, root = document.documentElement.style;
  let u;
  if (document.body.dataset.pos === "full") {
    // FULL SCREEN (default): the card fills the whole browser source, so you size and place it in Streamlabs.
    if (!CARD_H) { root.setProperty("--u", "1px"); CARD_H = document.getElementById("card").offsetHeight; }
    u = Math.min(w / (600 + 44), h / (CARD_H + 44)) * SCALE;       // small margin so the glow is not cut off
  } else {
    // corner mode (?pos=bl|br|tl|tr|c): one unit = one pixel on a 1920x1080 canvas
    u = (w >= h ? Math.min(w / 1920, h / 1080) : w / 1080 * 1.5) * SCALE;
  }
  root.setProperty("--u", u + "px");
}
addEventListener("resize", fit);

// same colour bands as The Feedback Loop: 90+ gold, 75+ green, 60+ orange, below red
const colour = s => s >= 90 ? "var(--gold)" : s >= 75 ? "var(--green)" : s >= 60 ? "var(--orange)" : "var(--red)";
const tierName = s => s >= 90 ? "ELITE" : s >= 75 ? "STRONG" : s >= 60 ? "GETTING THERE" : "KEEP WORKING";

const $ = id => document.getElementById(id);
const rows = {};
for (const [k, label] of CATS) {
  const r = document.createElement("div"); r.className = "row idle";
  r.innerHTML = `<div class="lab">${label}</div><div class="bar"><div class="fill"></div><div class="sheen"></div></div><div class="num">—</div>`;
  $("rows").appendChild(r);
  rows[k] = { el: r, fill: r.querySelector(".fill"), num: r.querySelector(".num"), shown: null, anim: 0 };
}
fit(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { CARD_H = 0; fit(); });
function count(node, from, to, ms, obj) {   // count the number up/down
  cancelAnimationFrame(obj.anim); const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(from + (to - from) * e); if (p < 1) obj.anim = requestAnimationFrame(step); };
  obj.anim = requestAnimationFrame(step);
}
function hit(el) { el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); }

const ov = { shown: null, anim: 0 };
function render(s) {
  $("card").classList.toggle("on", !!s.visible);
  $("song").textContent = s.song || "NOW PLAYING";
  $("artist").textContent = s.artist || "";
  for (const [k] of CATS) {
    const r = rows[k], v = s.scores ? s.scores[k] : null;
    if (v === r.shown) continue;
    r.el.classList.toggle("na", v === "na"); r.el.classList.toggle("idle", v === null || v === undefined);
    if (typeof v === "number") {
      r.fill.style.transform = `scaleX(${v / 100})`; r.el.style.setProperty("--c", colour(v));
      count(r.num, typeof r.shown === "number" ? r.shown : 0, v, 800, r); hit(r.el);
    } else {
      cancelAnimationFrame(r.anim); r.fill.style.transform = "scaleX(0)"; r.el.style.removeProperty("--c");
      r.num.textContent = v === "na" ? "N/A" : "—";
    }
    r.shown = v;
  }
  const o = typeof s.overall === "number" ? s.overall : null;
  if (o !== ov.shown) {
    const foot = document.querySelector(".foot");
    if (o === null) { cancelAnimationFrame(ov.anim); $("overall").textContent = "—"; $("tier").textContent = "—"; foot.style.removeProperty("--c"); }
    else { foot.style.setProperty("--c", colour(o)); $("tier").textContent = tierName(o); count($("overall"), ov.shown ?? 0, o, 900, ov); hit($("overall")); }
    ov.shown = o;
  }
  $("stamp").classList.toggle("on", !!s.placement && !!s.visible);
}

/* The card also watches Nero itself: the moment Nero moves to a different song than the one that was
   rated, the card hides — even if the control page is closed or the phone is asleep. */
const FEED_URL = "https://zlujvgqnvrhxrhkefgqr.supabase.co/functions/v1/nero-feed";
let rev = -1, last = {}, neroId = null;
const stale = () => !!(last.songId && neroId && neroId !== last.songId);
const draw = () => render(Object.assign({}, last, { visible: !!last.visible && !stale() }));
async function poll() {
  try {
    const r = await fetch(STATE_URL + "?t=" + Date.now(), { cache: "no-store" }); const j = await r.json();
    if (j.ok && j.rev !== rev) { rev = j.rev; last = j.state || {}; draw(); }
  } catch (e) { /* keep showing the last state; try again */ }
  setTimeout(poll, 800);
}
async function watchNero() {
  try {
    const j = await (await fetch(FEED_URL + "?t=" + Date.now(), { cache: "no-store" })).json();
    const id = j.live && j.current ? j.current.id : null;
    if (id !== neroId) { neroId = id; draw(); }
  } catch (e) {}
  setTimeout(watchNero, 2500);
}
if (qs.has("demo")) {
  const demo = { visible: true, song: "Street Hits", artist: "Sample Artist", scores: { drums: null, melody: null, vocals: null, mix: null, originality: null }, overall: null };
  render(demo);
  const seq = [["drums", 85], ["melody", 92], ["vocals", "na"], ["mix", 70], ["originality", 55]];
  seq.forEach(([k, v], i) => setTimeout(() => { demo.scores[k] = v; const n = Object.values(demo.scores).filter(x => typeof x === "number");
    demo.overall = Math.round(n.reduce((a, b) => a + b, 0) / n.length); demo.placement = i === 4; render(demo); }, 1200 + i * 1100));
} else { poll(); watchNero(); }
</script>
</body>
</html>
